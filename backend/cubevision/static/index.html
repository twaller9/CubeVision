<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubeVision Console</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0; --accent: #2f6fde;
    --W: #ffffff; --Y: #ffd400; --R: #d62828; --O: #ff8c1a; --G: #1f9d55; --B: #1e5bd8; --unk: #c9c9c9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1d1d20; --ink: #ededee; --muted: #9a9aa0; --line: #2e2e33; --accent: #6c9bff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  .pill { padding: 3px 10px; border-radius: 99px; background: var(--line); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .net { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; max-width: 420px; }
  .net div { aspect-ratio: 1; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
  .net .gap { border: 0; background: transparent; }
  button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .step { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 6px 0; }
  .step.done { opacity: .45; border-color: var(--line); }
  .step.cur { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .alg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  .alg .m { padding: 1px 3px; border-radius: 4px; }
  .alg .m.now { background: var(--accent); color: #fff; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; }
  #say { font-size: 18px; min-height: 1.5em; }
  textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>CubeVision console</h1>
  <span class="pill" id="phase">connecting…</span>
  <span class="pill" id="conn">offline</span>
</header>
<main>
  <div style="display:grid; gap:16px; min-width:0">
    <section>
      <h2>Glasses would say</h2>
      <div id="say" class="muted">—</div>
    </section>
    <section>
      <h2>Cube</h2>
      <div class="net" id="net"></div>
      <p class="muted" id="seen"></p>
    </section>
    <section>
      <h2>Simulator (no glasses / vision needed)</h2>
      <div class="row">
        <button class="primary" onclick="sim('scramble')">Scramble &amp; scan</button>
        <button onclick="sim('next_move')">Do next move</button>
        <button onclick="runAll()">Do all moves</button>
        <button onclick="sim('wrong_move')">Do a wrong move</button>
        <button onclick="send({type:'reset'})">Reset</button>
      </div>
      <div class="row">
        <label>Level <select id="level" onchange="send({type:'config', level:this.value})">
          <option value="full">Full CFOP</option><option value="2look">2-look (beginner)</option></select></label>
      </div>
      <h2 style="margin-top:14px">Pipe in face observations (vision-model format)</h2>
      <textarea id="obs">[{"grid": [["W","W","W"],["W","W","W"],["W","W","W"]]}]</textarea>
      <div class="row"><button onclick="sendObs()">Send observations</button></div>
    </section>
  </div>
  <div style="display:grid; gap:16px; min-width:0; align-content:start">
    <section>
      <h2>Solution</h2>
      <div id="orient" class="muted"></div>
      <div id="steps"></div>
    </section>
    <section>
      <h2>Events</h2>
      <div id="log"></div>
    </section>
  </div>
</main>
<script>
const session = new URLSearchParams(location.search).get('session') || 'default';
let ws;
const $ = id => document.getElementById(id);

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/viewer?session=${session}`);
  ws.onopen = () => { $('conn').textContent = 'live'; };
  ws.onclose = () => { $('conn').textContent = 'offline'; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    for (const ev of msg.events) log(ev);
    render(msg.snapshot);
  };
}
function send(m) { ws && ws.readyState === 1 && ws.send(JSON.stringify(m)); }
function sendObs() {
  try { send({type: 'observations', faces: JSON.parse($('obs').value)}); }
  catch (e) { alert('Invalid JSON: ' + e.message); }
}
async function sim(action) {
  const r = await fetch(`/api/${session}/simulate`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action})});
  return r.json();
}
async function runAll() {
  for (let i = 0; i < 200; i++) {
    const r = await sim('next_move');
    if (r.snapshot.phase !== 'solving') break;
    await new Promise(res => setTimeout(res, 120));
  }
}
function log(ev) {
  if (ev.say) $('say').textContent = ev.say;
  const short = {...ev}; delete short.solution; delete short.step; delete short.snapshot;
  const line = document.createElement('div');
  line.textContent = JSON.stringify(short);
  $('log').prepend(line);
}
// net layout: 12 cols x 9 rows, faces placed like the standard net
const NET = {U: [0, 3], L: [3, 0], F: [3, 3], R: [3, 6], B: [3, 9], D: [6, 3]};
function render(s) {
  $('phase').textContent = s.phase;
  $('seen').textContent = s.phase === 'scanning' ? `Seen: ${s.faces_seen.join(' ') || 'none'} · missing: ${s.missing.join(' ')}` : '';
  const grid = Array.from({length: 9}, () => Array(12).fill(null));
  if (s.state) {
    'URFDLB'.split('').forEach((f, fi) => {
      const [r0, c0] = NET[f];
      for (let k = 0; k < 9; k++) grid[r0 + Math.floor(k / 3)][c0 + k % 3] = s.state[fi * 9 + k];
    });
  }
  $('net').innerHTML = grid.flat().map(c => c === null
    ? (s.state ? '<div class="gap"></div>' : '<div class="gap"></div>')
    : `<div style="background:var(--${'WYROGB'.includes(c) ? c : 'unk'})"></div>`).join('');
  if (!s.state) $('net').innerHTML = Object.entries(NET).map(() => '').join('') + '<p class="muted" style="grid-column:1/-1">Waiting for a full scan…</p>';
  const sol = s.solution;
  if (!sol) { $('steps').innerHTML = ''; $('orient').textContent = ''; return; }
  $('orient').textContent = `${sol.orientation.say} ${sol.total_moves} moves.`;
  let moveCount = 0;
  $('steps').innerHTML = sol.steps.map((st, i) => {
    const start = moveCount; moveCount += st.moves.length;
    const cls = i < s.step_index ? 'done' : i === s.step_index ? 'cur' : '';
    const pureFaceTurns = st.alg.split(' ').filter(Boolean).join(' ') === st.moves.join(' ');
    const alg = pureFaceTurns
      ? st.moves.map((m, k) => `<span class="m ${start + k === s.move_index ? 'now' : ''}">${m}</span>`).join(' ')
      : esc(st.alg);
    return `<div class="step ${cls}"><b>${esc(st.title)}</b><div class="alg">${alg || '—'}</div>
      <div class="muted" style="font-size:13px">${esc(st.explanation)}</div></div>`;
  }).join('');
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
connect();
</script>
</body>
</html>
